<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Le compte à rebours de Noël 🎄</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 10%,#275b80,#081a34 75%);color:white;font-family:system-ui,sans-serif;display:grid;place-items:center;overflow:hidden}.scene{text-align:center;padding:35px 16px;position:relative;z-index:2;width:min(100%,750px)}h1{color:#ffe6a4;font-size:clamp(30px,6vw,55px);text-shadow:0 3px 15px #000;margin:10px 0}.sleigh{font-size:clamp(35px,8vw,65px);animation:float 5s ease-in-out infinite}.clock{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:30px auto}.tile{background:linear-gradient(150deg,#bd293b,#771522);border:2px solid #dcae64;border-radius:14px;padding:18px 4px;box-shadow:0 8px 24px #0008}.number{font-size:clamp(28px,7vw,60px);font-weight:800;font-variant-numeric:tabular-nums}.unit{font-size:clamp(10px,2.5vw,15px);text-transform:uppercase}.tree{font-size:80px;animation:glow 2s infinite alternate}.snow{position:fixed;inset:0;pointer-events:none}.flake{position:absolute;top:-30px;animation:fall linear infinite;color:#fff;opacity:.75}@keyframes fall{to{transform:translateY(110vh) rotate(300deg)}}@keyframes float{50%{transform:translateY(-12px)}}@keyframes glow{to{filter:drop-shadow(0 0 20px gold)}}p{font-size:clamp(16px,3vw,23px)}footer{opacity:.8;font-size:13px}</style></head><body><div class="snow" id="snow"></div><main class="scene"><div class="sleigh">🦌 🦌 🛷🎅</div><h1>✨ La magie de Noël ✨</h1><p>Plus que...</p><div class="clock"><div class="tile"><div class="number" id="d">--</div><div class="unit">Jours</div></div><div class="tile"><div class="number" id="h">--</div><div class="unit">Heures</div></div><div class="tile"><div class="number" id="m">--</div><div class="unit">Minutes</div></div><div class="tile"><div class="number" id="s">--</div><div class="unit">Secondes</div></div></div><p id="message">avant Noël 2026 !</p><div class="tree">🎄</div><div style="font-size:36px">🎁 🎁 ⭐ 🎁 🎁</div><footer>Un peu de magie à partager ❤️</footer></main><script>const snow=document.getElementById('snow');for(let i=0;i<65;i++){let f=document.createElement('span');f.className='flake';f.textContent=i%4?'•':'❄';f.style.left=Math.random()*100+'%';f.style.fontSize=(7+Math.random()*16)+'px';f.style.animationDuration=(5+Math.random()*10)+'s';f.style.animationDelay=(-Math.random()*15)+'s';snow.appendChild(f)}function update(){let t=Math.max(0,new Date('2026-12-25T00:00:00+01:00')-Date.now());let d=Math.floor(t/86400000);t%=86400000;let h=Math.floor(t/3600000);t%=3600000;let m=Math.floor(t/60000);let s=Math.floor(t%60000/1000);for(let [id,n] of [['d',d],['h',h],['m',m],['s',s]])document.getElementById(id).textContent=String(n).padStart(2,'0');if(d+h+m+s===0)document.getElementById('message').textContent='🎉 Joyeux Noël ! 🎉'}update();setInterval(update,1000)</script></body></html>
